<html lang="en">
<head>

<title>WebOS 11 Simulator</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:"Segoe UI",Arial,sans-serif;
    color:white;
}

body{

      radial-gradient(circle at 80% 70%,#934bd455,transparent 35%),
      linear-gradient(135deg,#071526,#123d68 50%,#35195d);
}

button,input,textarea{font:inherit}

button{
    color:white;
    border:0;
}

#desktop{
    position:absolute;
    inset:0 0 58px 0;
}

.desktop-icons{
    position:absolute;
    left:10px;
    top:10px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.desktop-icon{
    width:85px;
    padding:8px 3px;
    text-align:center;
    border-radius:6px;
    cursor:pointer;
}

.desktop-icon:hover{
    background:#ffffff18;
}

.desktop-icon .icon{
    display:block;
    font-size:34px;
    margin-bottom:5px;
}

.desktop-icon span:last-child{
    font-size:12px;
    text-shadow:0 1px 3px #000;
}

#taskbar{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:58px;
    z-index:10000;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111722dd;
    backdrop-filter:blur(20px);
    border-top:1px solid #ffffff18;
}

.task-buttons{
    display:flex;
    gap:4px;
}

.task-button{
    width:44px;
    height:44px;
    border-radius:7px;
    background:transparent;
    cursor:pointer;
    font-size:22px;
}

.task-button:hover{

}

#tray{
    position:absolute;
    right:10px;
    height:100%;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

#tray button{
    background:transparent;
    padding:6px;
    border-radius:5px;
    cursor:pointer;
}

#tray button:hover{
    background:#ffffff15;
}

#clock{
    text-align:right;
    line-height:15px;
}

/* START MENU */

#startMenu{
    display:none;
    position:absolute;
    z-index:20000;
    left:50%;
    bottom:66px;
    transform:translateX(-50%);
    width:650px;
    height:590px;
    padding:25px;
    border-radius:10px;
    background:#1b2029ee;
    backdrop-filter:blur(25px);
    border:1px solid #ffffff18;
    box-shadow:0 25px 70px #0009;
}

#startMenu.show{
    display:block;
}

.start-search{
    width:100%;
    height:42px;
    padding:0 18px;
    border-radius:22px;
    border:1px solid #ffffff20;
    outline:none;

    color:white;
}

.start-title{
    margin:24px 5px 12px;

}

.start-apps{

    grid-template-columns:repeat(6,1fr);

}

.start-app{
    padding:12px 4px;
    text-align:center;
    border-radius:7px;
    cursor:pointer;
    font-size:12px;
}

.start-app:hover{

}

.start-app b{

    font-size:28px;

}

/* WINDOWS */

.window{
    position:absolute;
    z-index:100;
    width:720px;
    height:500px;
    min-width:320px;
    min-height:220px;
    overflow:hidden;
    border-radius:9px;
    background:#1b2028f5;
    backdrop-filter:blur(25px);
    border:1px solid #ffffff20;
    box-shadow:0 25px 80px #0008;
}

.window.hidden{
    display:none;
}

.window.maximized{
    left:8px!important;
    top:8px!important;
    width:calc(100% - 16px)!important;
    height:calc(100% - 74px)!important;
}

.titlebar{
    height:43px;

    align-items:center;

}

.title-icon{

}

.title-text{

}

.window-controls{

}

.window-controls button{

    background:transparent;

}

.window-controls button:hover{

}

.window-controls .close:hover{

}

.content{

<script>

/* =========================================================
   FILE SYSTEM
========================================================= */

const FILE_STORAGE = "webos11_files";
const RECYCLE_STORAGE = "webos11_recycle";

let filesystem = JSON.parse(
    localStorage.getItem(FILE_STORAGE)
);

let recycleBin = JSON.parse(
    localStorage.getItem(RECYCLE_STORAGE)
);

if(!filesystem){

    filesystem = {
        type:"folder",
        name:"This PC",
        children:[
            {
                type:"folder",
                name:"Documents",
                children:[
                    {
                        type:"file",
                        name:"Welcome.txt",
                        content:
`Welcome to WebOS 11!

This is a real simulated file stored in your browser.

Try editing this file, creating folders, and deleting files.`
                    }
                ]
            },
            {
                type:"folder",
                name:"Downloads",
                children:[]
            },
            {
                type:"folder",
                name:"Pictures",
                children:[]
            },
            {
                type:"folder",
                name:"Desktop",
                children:[]
            },
            {
                type:"folder",
                name:"Music",
                children:[]
            }
        ]
    };

    saveFilesystem();
}

if(!Array.isArray(recycleBin)){
    recycleBin = [];
    saveRecycle();
}

function saveFilesystem(){
    localStorage.setItem(
        FILE_STORAGE,
        JSON.stringify(filesystem)
    );
}

function saveRecycle(){
    localStorage.setItem(
        RECYCLE_STORAGE,
        JSON.stringify(recycleBin)
    );
}


/* =========================================================
   PATH / FILE SYSTEM HELPERS
========================================================= */

function pathParts(path){
    return path
        .split("/")
        .filter(Boolean);
}

function getFolder(path){

    let current = filesystem;

    for(const part of pathParts(path)){

        if(!current.children){
            return null;
        }

        current = current.children.find(
            item => item.name === part
        );

        if(!current){
            return null;
        }
    }

    return current;
}


/*
IMPORTANT:
This was one of the bugs in the previous version.

The old code accidentally used "=" instead of comparing
the generated filename. This version correctly uses !==.
*/

function getUniqueName(folder, requestedName){

    if(
        !folder.children.some(
            item => item.name === requestedName
        )
    ){
        return requestedName;
    }

    let extension = "";
    let base = requestedName;

    const dot = requestedName.lastIndexOf(".");

    if(dot > 0){
        base = requestedName.substring(0,dot);
        extension = requestedName.substring(dot);
    }

    let number = 2;
    let candidate;

    do{

        candidate =
            `${base} (${number})${extension}`;

        number++;

    }while(
        folder.children.some(
            item => item.name === candidate
        )
    );

    return candidate;
}


/* =========================================================
   WINDOW SYSTEM
========================================================= */

const windows = {};
let windowZ = 100;
let explorerPath = "";

function createWindow(
    id,
    title,
    icon,
    html,
    width=720,
    height=500
){

    /*
    If an app is already open, bring it forward
    instead of creating another broken copy.
    */

    if(windows[id]){

        windows[id].classList.remove("hidden");

        focusWindow(windows[id]);

        return windows[id];
    }

    const win = document.createElement("div");

    win.className = "window";

    win.id = "window-" + id;

    win.style.width = width + "px";
    win.style.height = height + "px";

    win.style.left =
        Math.max(
            20,
            (window.innerWidth-width)/2
        ) + "px";

    win.style.top =
        Math.max(
            20,
            (window.innerHeight-height-58)/2
        ) + "px";

    win.style.zIndex = ++windowZ;

    win.innerHTML = `

        <div class="titlebar">

            <div class="title-icon">
                ${icon}
            </div>

            <div class="title-text">
                ${escapeHTML(title)}
            </div>

            <div class="window-controls">

                <button
                    onclick="minimizeWindow('${id}')">
                    ─
                </button>

                <button
                    onclick="maximizeWindow('${id}')">
                    □
                </button>

                <button
                    class="close"
                    onclick="closeWindow('${id}')">
                    ✕
                </button>

            </div>

        </div>

        <div class="content">
            ${html}
        </div>
    `;

    document.body.appendChild(win);

    windows[id] = win;

    makeDraggable(win);

    win.addEventListener(
        "mousedown",
        () => focusWindow(win)
    );

    return win;
}


function focusWindow(win){

    windowZ++;

    win.style.zIndex = windowZ;
}


function minimizeWindow(id){

    if(windows[id]){
        windows[id].classList.add("hidden");
    }
}


function maximizeWindow(id){

    if(windows[id]){
        windows[id].classList.toggle("maximized");
    }
}


function closeWindow(id){

    /*
    Required behavior:
    closing Recycle Bin permanently deletes its contents.
    */

    if(id === "recycle"){

        if(recycleBin.length > 0){

            recycleBin = [];

            saveRecycle();

            showToast(
                "Recycle Bin permanently emptied."
            );
        }
    }

    if(windows[id]){

        windows[id].remove();

        delete windows[id];
    }
}


/* =========================================================
   DRAGGING
========================================================= */

function makeDraggable(win){

    const titlebar =
        win.querySelector(".titlebar");

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;

    titlebar.addEventListener(
        "mousedown",
        event => {

            if(
                event.target.closest(
                    ".window-controls"
                )
            ){
                return;
            }

            if(win.classList.contains("maximized")){
                return;
            }

            dragging = true;

            focusWindow(win);

            offsetX =
                event.clientX -
                win.offsetLeft;

            offsetY =
                event.clientY -
                win.offsetTop;
        }
    );

    document.addEventListener(
        "mousemove",
        event => {

            if(!dragging){
                return;
            }

            win.style.left =
                Math.max(
                    0,
                    event.clientX-offsetX
                ) + "px";

            win.style.top =
                Math.max(
                    0,
                    event.clientY-offsetY
                ) + "px";
        }
    );

    document.addEventListener(
        "mouseup",
        () => {
            dragging = false;
        }
    );
}


/* =========================================================
   APP LAUNCHER
========================================================= */

function openApp(app){

    switch(app){

        case "explorer":
            openExplorer();
            break;

        case "browser":
            openBrowser();
            break;

        case "notepad":
            openNotepad();
            break;

        case "calculator":
            openCalculator();
            break;

        case "settings":
            openSettings();
            break;

        case "photos":
            openPhotos();
            break;

        case "recycle":
            openRecycle();
            break;

        case "search":
            openSearch();
            break;

        default:
            console.warn(
                "Unknown application:",
                app
            );
    }
}

function launchFromStart(app){

    toggleStart();

    openApp(app);
}


/* =========================================================
   FILE EXPLORER
========================================================= */

function openExplorer(){

    const html = `

        <div class="explorer-toolbar">

            <button
                class="toolbtn"
                onclick="explorerBack()">
                ←
            </button>

            <button
                class="toolbtn"
                onclick="explorerUp()">
                ↑
            </button>

            <input
                id="explorerAddress"
                class="address"
                value="This PC"
                onkeydown="
                    if(event.key==='Enter'){
                        navigateExplorer(this.value);
                    }
                "
            >

            <button
                class="toolbtn"
                onclick="createFolder()">
                ＋ Folder
            </button>

            <button
                class="toolbtn"
                onclick="createTextFile()">
                ＋ File
            </button>

        </div>


        <div class="explorer-body">

            <div class="sidebar">

                <div
                    class="sideitem"
                    onclick="navigateExplorer('')">
                    💻 This PC
                </div>

                <div
                    class="sideitem"
                    onclick="navigateExplorer('Documents')">
                    📄 Documents
                </div>

                <div
                    class="sideitem"
                    onclick="navigateExplorer('Downloads')">
                    ⬇️ Downloads
                </div>

                <div
                    class="sideitem"

function navigateExplorer(path){

    path = path.trim();

    if(path === "This PC"){
        path = "";
    }

    if(path.startsWith("This PC/")){
        path = path.substring(8);
    }

    const folder = getFolder(path);

    if(
        !folder ||
        folder.type !== "folder"
    ){

        showToast("Folder not found");

        return;
    }

    explorerPath = path;

    const address =
        document.getElementById(
            "explorerAddress"
        );

    if(address){

        address.value =
            path
            ? "This PC/" + path
            : "This PC";
    }

    renderExplorer();
}


function renderExplorer(){

    const grid =
        document.getElementById(
            "fileGrid"
        );

    if(!grid){
        return;
    }

    const folder =
        getFolder(explorerPath);

    if(!folder){
        return;
    }

    grid.innerHTML = "";

    folder.children.forEach(item => {

        const element =
            document.createElement("div");

        element.className = "file";

        element.innerHTML = `

            <span class="file-icon">
                ${item.type === "folder"
                    ? "📁"
                    : "📄"}
            </span>

            <span class="file-name">
                ${escapeHTML(item.name)}
            </span>
        `;

        element.ondblclick = () => {

            if(item.type === "folder"){

                const newPath =
                    explorerPath
                    ? explorerPath + "/" + item.name
                    : item.name;

                navigateExplorer(newPath);

            }else{

                openFile(item);
            }
        };

        element.oncontextmenu = event => {

            event.preventDefault();

            showFileContextMenu(
                event.clientX,
                event.clientY,
                item
            );
        };

        grid.appendChild(element);
    });
}


function explorerBack(){

    const parts =
        pathParts(explorerPath);

    parts.pop();

    navigateExplorer(
        parts.join("/")
    );
}


function explorerUp(){
    explorerBack();
}

let selectedItem = null;


function showFileContextMenu(

){

function openSelectedItem(){

    if(!selectedItem){
        return;
    }

    if(
        selectedItem.type ===
        "folder"
    ){

        navigateExplorer(
            explorerPath
            ? explorerPath + "/" + selectedItem.name
            : selectedItem.name
        );

    }else{

        openFile(selectedItem);
    }

    hideContext();
}


function renameSelectedItem(){

    if(!selectedItem){
        return;
    }

    const newName =
        prompt(
            "Enter the new name:",
            selectedItem.name
        );

    if(
        !newName ||
        newName === selectedItem.name
    ){

        hideContext();

        return;
    }

    const folder =
        getFolder(explorerPath);

    if(
        folder.children.some(
            item =>
                item !== selectedItem &&
                item.name === newName
        )
    ){

        showToast(
            "That name already exists."
        );

        return;
    }

    selectedItem.name =
        newName;

    saveFilesystem();

    renderExplorer();

    hideContext();
}


function deleteSelectedItem(){

    if(!selectedItem){
        return;
    }

    if(
        !confirm(
            "Move '" +
            selectedItem.name +
            "' to the Recycle Bin?"
        )
    ){

        hideContext();

        return;
    }

    const folder =
        getFolder(explorerPath);

    const index =
        folder.children.indexOf(
            selectedItem
        );

    if(index === -1){
        return;
    }

    folder.children.splice(
        index,
        1
    );

    recycleBin.push({

        type:selectedItem.type,

        name:selectedItem.name,

        content:selectedItem.content || "",

        children:selectedItem.children || [],

        originalPath:explorerPath,

        deletedAt:
            new Date().toISOString()
    });

    saveFilesystem();

    saveRecycle();

    renderExplorer();

    showToast(
        selectedItem.name +
        " moved to Recycle Bin."
    );

    hideContext();
}

   NOTEPAD
========================================================= */

function findPath(target){

    function search(
        node,
        path
    ){

        if(node === target){
            return path;
        }

        if(
            node.type === "folder" &&
            node.children
        ){

            for(
                const child of node.children
            ){

                const result =
                    search(
                        child,
                        path
                        ? path + "/" + child.name
                        : child.name
                    );

                if(result !== null){
                    return result;
                }
            }
        }

        return null;
    }

    return search(
        filesystem,
        ""
    );
}


function getNodeByPath(path){

    if(!path){
        return filesystem;
    }

    let current =
        filesystem;

    for(
        const part of pathParts(path)
    ){

        if(
            !current.children
        ){
            return null;
        }

        current =
            current.children.find(
                item =>
                    item.name === part
            );

        if(!current){
            return null;
        }
    }

    return current;
}

}


function openNotepad(file=null){

    const id = "notepad";

    const html = `

    `;

    const win =

            700,

        );

    const textarea =
        win.querySelector(

function saveNotepad(){

    const win =
        windows.notepad;

    if(!win){
        return;
    }

    const text =
        win.querySelector(
            "#noteText"
        ).value;

    let path =
        win.dataset.filePath;

    if(!path){

        const folder =
            getFolder(explorerPath);

        const name =
            getUniqueName(
                folder,
                "Untitled.txt"
            );

        const file = {

            type:"file",

            name:name,

            content:text
        };

        folder.children.push(file);

        path =
            explorerPath
            ? explorerPath + "/" + name
            : name;

        win.dataset.filePath =
            path;

    }else{

        const file =
            getNodeByPath(path);

        if(file){
            file.content =
                text;
        }
    }

    saveFilesystem();

    renderExplorer();

    const status =
        win.querySelector(
            "#noteStatus"
        );

    status.textContent =
        "Saved";

    setTimeout(
        () => {
            status.textContent = "";
        },
        1500
    );

    showToast(
        "File saved."
    );
}


function saveNotepadAs(){

    const win =
        windows.notepad;

    if(!win){
        return;
    }

    const requested =
        prompt(
            "File name:",
            "My File.txt"
        );

    if(!requested){
        return;
    }

    const folder =
        getFolder(explorerPath);

    const name =
        getUniqueName(
            folder,
            requested
        );

    const file = {

        type:"file",

        name:name,

        content:
            win.querySelector(
                "#noteText"
            ).value
    };

    folder.children.push(file);

    win.dataset.filePath =
        explorerPath
        ? explorerPath + "/" + name
        : name;

    saveFilesystem();

    renderExplorer();

    showToast(
        "Saved as " + name
    );
}

function navigateBrowser(){

    const input =
        document.getElementById(
            "urlbar"
        );

    if(!input){
        return;
    }

    let url =
        input.value.trim();

    if(!url){
        return;
    }

    if(
        !/^https?:\/\//i.test(url)
    ){

        if(
            url.includes(".") &&
            !url.includes(" ")
        ){

            url =
                "https://" + url;

        }else{

            url =
                "https://www.google.com/search?q=" +
                encodeURIComponent(url);
        }
    }

    const view =
        document.getElementById(
            "browserView"
        );

    /*
    Some websites block iframes using X-Frame-Options/CSP.
    That is a restriction imposed by the website, not by WebOS.
    */

    view.innerHTML = `

        <iframe
            class="browser-frame"
            src="${escapeHTML(url)}"
            sandbox="
                allow-forms
                allow-modals
                allow-popups
                allow-presentation
                allow-same-origin
                allow-scripts
            ">
        </iframe>
    `;
}


function browserHome(){

    const url =
        document.getElementById(
            "urlbar"
        );

    const view =
        document.getElementById(
            "browserView"
        );

    if(url){
        url.value = "";
    }

    if(view){

        view.innerHTML = `

            <div class="browser-home">

                <h1>🌐 WebOS Edge</h1>

                <p>
                    Enter a URL above.
                </p>

            </div>
        `;
    }
}

function calcInput(value){

    calculatorExpression +=
        value;

    updateCalculator();
}


function calcClear(){

    calculatorExpression = "";

    updateCalculator();
}


function calcBack(){

    calculatorExpression =
        calculatorExpression.slice(
            0,
            -1
        );

    updateCalculator();
}


function calcSqrt(){

    const number =
        Number(
            calculatorExpression || 0
        );

    if(number < 0){

        calculatorExpression =
            "Error";

    }else{

        calculatorExpression =
            String(
                Math.sqrt(number)
            );
    }

    updateCalculator();
}


function calcEquals(){

    try{

        if(
            !/^[0-9+\-*/%(). ]+$/.test(
                calculatorExpression
            )
        ){
            throw new Error();
        }

        calculatorExpression =
            String(
                Function(
                    "return " +
                    calculatorExpression
                )()
            );

    }catch{

        calculatorExpression =
            "Error";
    }

    updateCalculator();
}


function updateCalculator(){

    const display =
        document.getElementById(
            "calcDisplay"
        );

    if(display){

        display.textContent =
            calculatorExpression ||
            "0";
    }
}

                <div onclick="createTextFile();hideContext()">
                    📄 New text document
                </div>

                <div onclick="createFolder();hideContext()">
                    📁 New folder
                </div>

                <div onclick="openApp('explorer');hideContext()">
                    📂 Open File Explorer
                </div>

                <div onclick="location.reload()">
                    🔄 Refresh
                </div>

                <div onclick="openApp('settings');hideContext()">
                    ⚙️ Personalize
                </div>
            `;

            menu.style.left =
                event.clientX + "px";

            menu.style.top =
                event.clientY + "px";

            menu.style.display =
                "block";
        }
    );


document.addEventListener(
    "click",
    event => {

        const menu =
            document.getElementById(
                "contextMenu"
            );

        if(
            !event.target.closest(
                "#contextMenu"
            )
        ){

            menu.style.display =
                "none";
        }
    }
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "e"
        ){

            event.preventDefault();

            openApp("explorer");
        }

        if(
            event.key === "Escape"
        ){

            document
                .getElementById(
                    "startMenu"
                )
                .classList.remove(
                    "show"
                );

            document
                .getElementById(
                    "powerMenu"
                )
                .style.display =
                    "none";

            hideContext();
        }
    }
);


/* =========================================================
   DESKTOP
========================================================= */

document
    .getElementById("desktop")
    .addEventListener(
        "dblclick",
        event => {

            if(
                event.target ===
                document.getElementById(
                    "desktop"
                )
            ){

                openApp("explorer");
            }
        }
    );


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            character => {

                const replacements = {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"
                };

                return replacements[
                    character
                ];
            }
        );
}
